{% extends "base.html" %}

{% block title %}Create Account - HouseRent{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="form-card">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 bg-primary-subtle text-primary rounded-circle mb-3 fs-3">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Create an Account</h3>
                    <p class="text-muted small">Join HouseRent as a tenant looking for a home or a property owner listing rentals</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <!-- Role Selector -->
                    <div class="mb-4">
                        <label class="form-label d-block text-center mb-2">I am joining as:</label>
                        <div class="row g-2 justify-content-center">
                            <div class="col-sm-6">
                                <input type="radio" class="btn-check" name="role" id="role-renter" value="renter" checked autocomplete="off">
                                <label class="btn btn-outline-primary w-100 p-3 text-start d-flex align-items-center gap-3" for="role-renter">
                                    <i class="bi bi-person fs-3"></i>
                                    <div>
                                        <div class="fw-bold">Renter / Tenant</div>
                                        <small class="text-muted d-block" style="font-size: 0.75rem;">Browse homes and apply directly</small>
                                    </div>
                                </label>
                            </div>
                            <div class="col-sm-6">
                                <input type="radio" class="btn-check" name="role" id="role-owner" value="owner" autocomplete="off">
                                <label class="btn btn-outline-primary w-100 p-3 text-start d-flex align-items-center gap-3" for="role-owner">
                                    <i class="bi bi-house-gear fs-3"></i>
                                    <div>
                                        <div class="fw-bold">Property Owner</div>
                                        <small class="text-muted d-block" style="font-size: 0.75rem;">List and manage rental properties</small>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="full_name">Full Name *</label>
                            <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Ananya Rao" required autocomplete="name">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="username">Username *</label>
                            <input type="text" id="username" name="username" class="form-control" placeholder="e.g. ananya_rao" minlength="3" required autocomplete="username">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="email">Email Address *</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="name@domain.com" required autocomplete="email">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 98765 43210" autocomplete="tel">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="password">Password *</label>
                            <div class="input-group">
                                <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
                                <button class="btn btn-outline-secondary password-toggle-btn" type="button" data-target="password" title="Toggle Visibility">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="confirm_password">Confirm Password *</label>
                            <div class="input-group">
                                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required autocomplete="new-password">
                                <button class="btn btn-outline-secondary password-toggle-btn" type="button" data-target="confirm_password" title="Toggle Visibility">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary w-100 btn-rounded py-2 fw-semibold">
                            <i class="bi bi-check-circle me-1"></i> Complete Registration
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="small text-muted mb-0">
                        Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
