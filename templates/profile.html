{% extends "base.html" %}

{% block title %}Account Settings - HouseRent{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Header -->
            <div class="mb-4">
                <h2 class="fw-bold mb-1">Account Settings</h2>
                <p class="text-muted mb-0">Manage your profile details and security credentials</p>
            </div>

            <!-- Profile Info Card -->
            <div class="form-card mb-4 border-0">
                <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle text-primary"></i> Personal Information
                </h5>

                <form method="POST" action="{{ url_for('profile') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <input type="hidden" name="action" value="update_info">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="username">Username</label>
                            <input type="text" id="username" class="form-control bg-light" value="{{ user.username }}" readonly disabled>
                            <small class="text-muted">Username cannot be changed.</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Role</label>
                            <input type="text" class="form-control bg-light text-capitalize" value="{{ user.role }}" readonly disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="full_name">Full Name *</label>
                            <input type="text" id="full_name" name="full_name" class="form-control" value="{{ user.full_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="email">Email Address *</label>
                            <input type="email" id="email" name="email" class="form-control" value="{{ user.email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" class="form-control" value="{{ user.phone or '' }}" placeholder="+91 98765 43210">
                        </div>
                    </div>

                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-primary btn-rounded px-4 fw-semibold">
                            <i class="bi bi-check-circle me-1"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>

            <!-- Change Password Card -->
            <div class="form-card border-0">
                <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
                    <i class="bi bi-shield-lock text-primary"></i> Change Password
                </h5>

                <form method="POST" action="{{ url_for('profile') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <input type="hidden" name="action" value="change_password">

                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label" for="current_password">Current Password *</label>
                            <div class="input-group">
                                <input type="password" id="current_password" name="current_password" class="form-control" required autocomplete="current-password">
                                <button class="btn btn-outline-secondary password-toggle-btn" type="button" data-target="current_password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="new_password">New Password *</label>
                            <div class="input-group">
                                <input type="password" id="new_password" name="new_password" class="form-control" minlength="6" required autocomplete="new-password">
                                <button class="btn btn-outline-secondary password-toggle-btn" type="button" data-target="new_password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <small class="text-muted">Minimum 6 characters.</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="confirm_password">Confirm New Password *</label>
                            <div class="input-group">
                                <input type="password" id="confirm_password" name="confirm_password" class="form-control" minlength="6" required autocomplete="new-password">
                                <button class="btn btn-outline-secondary password-toggle-btn" type="button" data-target="confirm_password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-outline-primary btn-rounded px-4 fw-semibold">
                            <i class="bi bi-key me-1"></i> Update Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
