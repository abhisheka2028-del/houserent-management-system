# ==============================================================================
# Service 1: ClusterIP Service (Standard Internal Service)
# Accessed inside the cluster or via kubectl port-forward
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: houserent-service
  namespace: houserent
  labels:
    app: houserent
spec:
  type: ClusterIP
  selector:
    app: houserent
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
# ==============================================================================
# Service 2: NodePort Service (External Access for Minikube / Lab Environment)
# Exposes the service on a static high port (30080) on each cluster node
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: houserent-nodeport-service
  namespace: houserent
  labels:
    app: houserent
spec:
  type: NodePort
  selector:
    app: houserent
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30080
