services:
  - type: web
    name: houserent-docker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /app/data/houserent.db
      - key: UPLOAD_FOLDER
        value: /app/data/uploads
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: AUTO_SEED_DATA
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "2"

