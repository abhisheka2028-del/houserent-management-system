services:
  - type: web
    name: houserent-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: database/houserent.db
      - key: UPLOAD_FOLDER
        value: static/uploads
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: AUTO_SEED_DATA
        value: "true"
